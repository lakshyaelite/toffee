<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toffee — Send Support</title>
    <meta name="robots" content="noindex, nofollow">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
      :root { --tf-primary: #198754; }
      body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
      .app-container { max-width: 440px; width: 100%; }
      .toffee-card { border: none; border-radius: 1.25rem; box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.05); }
      .quantity-badge { background-color: #f1f3f5; border-radius: 0.75rem; padding: 0.75rem; }
      .qr-canvas-wrapper { padding: 1rem; border: 1px solid #e9ecef; border-radius: 1rem; background: #fff; display: inline-block; }
      
      /* Embed Mode Overrides */
      body.is-embedded { background: transparent !important; }
      body.is-embedded .hide-on-embed { display: none !important; }
      body.is-embedded .toffee-card { box-shadow: none; border: 1px solid #e9ecef; border-radius: 1rem; }
      @media (prefers-color-scheme: dark) {
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .toffee-card {
            background-color: #1e1e1e !important;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.3);
        }
        body.is-embedded .toffee-card {
            border-color: #333333;
        }
        .quantity-badge {
            background-color: #2d2d2d !important;
        }
        .form-control {
            background-color: #2d2d2d !important;
            border-color: #404040;
            color: #ffffff !important;
        }
        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
        }
        .form-floating label {
            color: #aaaaaa !important;
        }
        /* Keeps the QR code wrapper highly visible and scannable for cameras */
        .qr-canvas-wrapper {
            background: #ffffff !important; 
            border-color: #ffffff;
            padding: 1rem;
        }
        .text-muted, .text-secondary {
            color: #aaaaaa !important;
        }
        h2, h4, .form-label, label {
            color: #ffffff !important;
        }

        /* Fixes text inside the custom message box and the counter input text */
        .form-control, #toffeeCount {
            color: #ffffff !important;
        }

        /* Ensures Bootstrap's floating label stays visible when active or focused */
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: #198754 !important;
        }
        }
    </style>
  </head>
  <body>

    <main class="d-flex flex-column justify-content-center align-items-center min-vh-100 p-3">
      <div class="app-container">
        
        <div class="card toffee-card bg-white">
          <div class="card-body p-4 text-center">
            <h2 id="payeeName" class="h4 fw-bold mb-1">Support</h2>
            <p id="payeeSubtitle" class="text-muted small mb-4">Send a sweet token of appreciation</p>
            
            <form id="paymentForm" autocomplete="off" onsubmit="return false;">
              <div class="d-flex justify-content-center align-items-center quantity-badge mb-3">
                <span class="fs-3">🍬</span>
                <span class="mx-2 text-muted fw-light">×</span>
                <input type="number" min="1" class="form-control text-center fw-bold border-0 bg-transparent fs-5 p-0" id="toffeeCount" value="1" style="max-width: 70px;">
                <span id="totalPriceLabel" class="ms-2 fw-semibold text-secondary fs-5">= ₹5</span>
              </div>

              <div class="form-floating mb-3">
                <textarea class="form-control" id="customMessage" placeholder="Leave a message" maxlength="120" style="height: 70px; resize: none;"></textarea>
                <label for="customMessage" class="text-muted small">Custom Message (optional)</label>
              </div>

              <div id="qrWrapper" class="mb-3 d-none">
                <div id="upiQr" class="qr-canvas-wrapper"></div>
                <div class="small text-muted mt-2"><i class="bi bi-qr-code-scan"></i> Scan or click QR to pay</div>
              </div>

              <button id="payButton" type="submit" class="btn btn-success w-100 py-2.5 rounded-pill fw-bold">
                Send Money
              </button>
            </form>
          </div>
        </div>

        <footer class="text-center mt-4 hide-on-embed">
          <small class="text-muted">
            Powered by <a href="https://getmetoffee.vercel.app/" target="_blank" class="text-secondary text-decoration-none fw-semibold">Toffee</a>
          </small>
        </footer>

      </div>
    </main>

    <script src="js/payment.js"></script>
  </body>
</html>
