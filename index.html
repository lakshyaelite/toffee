<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toffee — UPI Tip Link Generator</title>
    <meta name="description" content="Instantly generate UPI tip links and embed widgets for your website.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
      body { background-color: #f4f6f8; color: #333; }
      .app-container { max-width: 480px; width: 100%; }
      .dashboard-card { border: none; border-radius: 1.25rem; box-shadow: 0 8px 30px rgba(0,0,0,0.04); }
      .code-display { background-color: #212529; color: #f8f9fa; font-family: monospace; font-size: 0.85rem; }
      @media (prefers-color-scheme: dark) {
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .dashboard-card {
            background-color: #1e1e1e !important;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
        .form-control, .input-group-text {
            background-color: #2d2d2d !important;
            border-color: #404040;
            color: #ffffff !important;
        }
        .form-control::placeholder {
            color: #888888;
        }
        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
        }
        hr {
            border-color: #404040 !important;
            opacity: 0.5;
        }
        .bg-light {
            background-color: #2d2d2d !important;
        }
        .text-muted, .text-secondary {
            color: #aaaaaa !important;
        }
        .btn-outline-secondary {
            border-color: #404040;
            color: #cccccc;
        }
        .btn-outline-secondary:hover {
            background-color: #2d2d2d;
            border-color: #505050;
        }
        h1, h5, .form-label, label {
            color: #ffffff !important;
        }

        /* Fixes the actual typed text inside the input fields */
        .form-control {
            color: #ffffff !important;
        }

        /* Fixes the static text/icons inside input groups (like the ₹ symbol) */
        .input-group-text {
            background-color: #2d2d2d !important;
            border-color: #404040 !important;
            color: #aaaaaa !important;
        }
        }
    </style>
  </head>
  <body>

    <main class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-5">
      <div class="app-container">
        
        <div class="text-center mb-4">
          <h1 class="fw-black display-6 m-0">🍬 Toffee</h1>
          <p class="text-muted small mt-1">Accept small micro-tips in India instantly through UPI</p>
        </div>

        <div class="card dashboard-card p-4 bg-white">
          <h5 class="fw-bold mb-3">Create your tip link</h5>
          
          <form id="toffeeForm" onsubmit="return false;">
            <div class="mb-3">
              <label for="upiId" class="form-label small fw-semibold">Enter your UPI ID</label>
              <input type="text" class="form-control" id="upiId" placeholder="username@bank" required>
            </div>

            <div class="mb-3">
              <label for="name" class="form-label small fw-semibold">Display Name (optional)</label>
              <input type="text" class="form-control" id="name" placeholder="e.g. Lakshya">
            </div>

            <div class="mb-4">
              <label for="toffeePrice" class="form-label small fw-semibold">Base Price per Toffee</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted">₹</span>
                <input type="number" class="form-control" id="toffeePrice" min="1" value="5" required>
              </div>
            </div>

            <button id="generate-links" type="button" class="btn btn-success w-100 py-2.5 rounded-pill fw-semibold">
              Generate Links & Widgets
            </button>
          </form>

          <section id="resultBox" class="mt-4 d-none">
            <hr class="text-muted my-4">

            <div class="mb-3">
              <label class="form-label small fw-bold text-success"><i class="bi bi-code-slash"></i> Embed Widget Code</label>
              <div class="input-group">
                <textarea id="iframeCode" class="form-control code-display" rows="3" readonly></textarea>
                <button class="btn btn-outline-secondary bg-light" type="button" id="copyIframe">
                  <i class="bi bi-copy"></i>
                </button>
              </div>
            </div>

            <div>
              <label class="form-label small fw-bold text-primary"><i class="bi bi-link-45deg"></i> Direct Web Page URL</label>
              <div class="input-group">
                <input type="text" class="form-control bg-light" id="directLink" readonly>
                <button class="btn btn-outline-secondary bg-light" type="button" id="copyLink">
                  <i class="bi bi-copy"></i>
                </button>
              </div>
            </div>
          </section>
        </div>

        <footer class="text-center mt-4">
          <p class="text-muted small mb-1">
            &copy; 2026 Toffee · Built by 
            <a href="https://lakshyasinghchauhan.com" target="_blank" class="text-secondary text-decoration-none fw-semibold">Lakshya Singh Chauhan</a>
          </p>
          <div class="text-muted context-version" style="font-size: 0.75rem;">Simple, secure & free peer-to-peer micro-payments</div>
        </footer>

      </div>
    </main>

    <script src="js/generate.js"></script>
  </body>
</html>
