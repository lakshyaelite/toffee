<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toffee — Embed</title>
    <meta name="robots" content="noindex">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
      /* Compact embed styles */
      body { background: transparent; }
      .embed-wrap { padding: 12px; max-width: 420px; }
      .embed-qr { display:flex; justify-content:center; }
    </style>
  </head>
  <body>
    <div class="embed-wrap card p-3 shadow-sm">
      <div class="text-center mb-2">
        <strong id="embedTitle">Support</strong>
        <div id="embedSubtitle" class="text-muted small">Send a quick tip</div>
      </div>

      <div class="d-flex justify-content-center align-items-center gap-2 my-2">
        <span style="font-size:1.2rem">🍬</span>
        <input id="embedCount" type="number" min="1" value="1" class="form-control form-control-sm text-center" style="max-width:80px;">
        <div id="embedPriceLabel" class="text-body-secondary small">= ₹5</div>
      </div>

      <div class="mb-2">
        <textarea id="embedMessage" class="form-control form-control-sm" rows="2" placeholder="Message (optional)" maxlength="120"></textarea>
      </div>

      <div id="embed-qr" class="embed-qr p-2 mb-2"></div>

      <div class="text-center">
        <button id="embed-pay" class="btn btn-success btn-sm rounded-pill w-100">Pay</button>
      </div>
    </div>

    <script src="js/iframe.js"></script>
  </body>
</html>
